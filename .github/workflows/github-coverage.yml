name: Coverage

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        client: [apixon-diodo-client, apixon-pwm-client, apixon-ai-client, apixon-ai-calibrate-client, apixon-pi-client]
    defaults:
      run:
        working-directory: Ventilsteuerung/Web-Clients/${{ matrix.client }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: Ventilsteuerung/Web-Clients/${{ matrix.client }}/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts
        shell: bash

      - name: Run tests with coverage
        run: npm run test:coverage
        shell: bash

      - name: Upload coverage artifact
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-typescript-${{ matrix.client }}
          path: Ventilsteuerung/Web-Clients/${{ matrix.client }}/coverage/cobertura-coverage.xml

  upload-coverage-typescript:
    needs: test
    if: ${{ !cancelled() && needs.test.result == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    strategy:
      matrix:
        client: [apixon-diodo-client, apixon-pwm-client, apixon-ai-client, apixon-ai-calibrate-client, apixon-pi-client]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      code-quality: write
    steps:
      - name: Download coverage artifact
        uses: actions/download-artifact@v4.1.3
        with:
          name: coverage-report-typescript-${{ matrix.client }}

      - uses: actions/upload-code-coverage@v1
        with:
          file: cobertura-coverage.xml
          language: TypeScript
          label: code-coverage-agent-${{ matrix.client }}
