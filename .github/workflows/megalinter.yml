name: MegaLinter

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  megalinter:
    name: MegaLinter
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: MegaLinter Runner
        uses: oxsecurity/megalinter@e08c2b05e3dbc40af4c23f41172ef1e068a7d651  # v8.8.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_ALL_CODEBASE: true
          # ENABLE_LINTERS (tried both as a YAML list in .mega-linter.yml
          # and as a CSV env var) did not restrict execution during the
          # ms-docs rollout - every sub-linter for each enabled language
          # still ran. DISABLE_LINTERS is the mechanism that actually
          # works: only PYTHON is enabled here, so only ruff needs
          # denylisting the rest of MegaLinter's Python linter set.
          DISABLE_LINTERS: PYTHON_BANDIT,PYTHON_BLACK,PYTHON_FLAKE8,PYTHON_ISORT,PYTHON_MYPY,PYTHON_PYLINT,PYTHON_PYRIGHT
