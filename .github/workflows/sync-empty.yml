name: Sync 4diac_training1_empty

# Bei jedem veroeffentlichten Release von training1 wird der Stand ohne
# Loesungen erzeugt (internal-scripts/sync_empty) und als PR vom Branch
# sync/<tag> nach empty/main gestellt. Nach dem Review und Merge legt der
# Workflow release-on-sync.yml im empty-Repo das Release <tag> an.
# Manuell (workflow_dispatch) laeuft standardmaessig nur ein Trockenlauf.
#
# Benoetigt das Secret EMPTY_REPO_TOKEN: fine-grained PAT oder App-Token
# mit "Contents" und "Pull requests" (Read and write) auf
# 4diac_training1_empty.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag in training1 (leer = neuester Tag)'
        required: false
        default: ''
      apply:
        description: 'Ergebnis nach empty schreiben und Release anlegen'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: sync-empty
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    env:
      EMPTY_REPO: Meisterschulen-am-Ostbahnhof-Munchen/4diac_training1_empty
    steps:
      - name: Checkout training1
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          path: training1

      - name: Tag bestimmen
        id: tag
        working-directory: training1
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="${RELEASE_TAG:-$INPUT_TAG}"
          if [ -z "$TAG" ]; then TAG=$(git tag --sort=-creatordate | head -1); fi
          git rev-parse --verify "refs/tags/$TAG" >/dev/null
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "release" ] || [ "${{ inputs.apply }}" = "true" ]; then
            echo "apply=true" >> "$GITHUB_OUTPUT"
          else
            echo "apply=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout empty
        uses: actions/checkout@v6
        with:
          repository: ${{ env.EMPTY_REPO }}
          token: ${{ secrets.EMPTY_REPO_TOKEN }}
          fetch-depth: 0
          path: empty

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Sync erzeugen
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          APPLY: ${{ steps.tag.outputs.apply }}
        run: |
          ARGS="--source training1 --target empty --ref refs/tags/$TAG --report report.md"
          if [ "$APPLY" = "true" ]; then ARGS="$ARGS --apply"; fi
          python training1/internal-scripts/sync_empty/sync_empty.py $ARGS | tee summary.txt
          head -40 summary.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Report hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sync-empty-report-${{ steps.tag.outputs.tag }}
          path: report.md
          if-no-files-found: ignore

      - name: PR ins empty-Repo stellen
        if: steps.tag.outputs.apply == 'true'
        working-directory: empty
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          GH_TOKEN: ${{ secrets.EMPTY_REPO_TOKEN }}
        run: |
          BRANCH="sync/$TAG"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add -A
          if git diff --cached --quiet; then
            echo "Keine Aenderungen fuer $TAG, kein PR"
            exit 0
          fi
          git commit -q -m "Stand von 4diac_training1 $TAG (ohne Loesungen)"
          git push --force origin "$BRANCH"
          {
            echo "Stand von 4diac_training1 **$TAG** ohne Lösungen, erzeugt von \`internal-scripts/sync_empty\`."
            echo
            echo "**Bitte vor dem Merge prüfen, ob keine Lösungen mitgekommen sind** (neue Ordner/Projekte)."
            echo "Nach dem Merge legt \`release-on-sync.yml\` das Release $TAG an."
            echo
            echo '```'
            head -60 ../summary.txt
            echo '```'
          } > ../pr_body.md
          if gh pr view "$BRANCH" -R "$EMPTY_REPO" >/dev/null 2>&1; then
            gh pr edit "$BRANCH" -R "$EMPTY_REPO" --body-file ../pr_body.md
          else
            gh pr create -R "$EMPTY_REPO" --base main --head "$BRANCH" --title "Sync aus 4diac_training1 $TAG" --body-file ../pr_body.md
          fi
